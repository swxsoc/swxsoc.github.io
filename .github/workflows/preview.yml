name: Build PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.html'
      - '**.css'
      - '_config.yml'
      - 'assets/**'

jobs:
  build-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Jekyll
        run: |
          gem install bundler jekyll
          gem install jekyll-theme-tactile
          gem install jekyll-seo-tag

      - name: Build site
        run: jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-pr-${{ github.event.pull_request.number }}
          path: _site/
          retention-days: 30

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const repo = context.repo;
            
            const comment = `## ✅ Preview Build Complete!
            
            A preview of the website has been built and is ready to view.
            
            ### Option 1: Download and View Locally
            1. Go to the [Actions tab](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})
            2. Scroll down to "Artifacts"
            3. Download \`site-preview-pr-${prNumber}\`
            4. Extract the ZIP file
            5. Open \`index.html\` in your browser
            
            ### Option 2: Run Local Server
            After downloading and extracting:
            \`\`\`bash
            cd site-preview-pr-${prNumber}
            python3 -m http.server 8000
            # Open http://localhost:8000 in your browser
            \`\`\`
            
            ### Option 3: Preview Locally with Jekyll
            Clone this branch and run:
            \`\`\`bash
            git fetch origin pull/${prNumber}/head:preview-pr-${prNumber}
            git checkout preview-pr-${prNumber}
            jekyll serve
            # Open http://localhost:4000 in your browser
            \`\`\`
            
            See [PREVIEW.md](https://github.com/${repo.owner}/${repo.repo}/blob/${context.payload.pull_request.head.ref}/PREVIEW.md) for detailed instructions.
            
            ---
            🎨 **Preview artifact will be available for 30 days.**`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: repo.owner,
              repo: repo.repo,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Build Complete')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: repo.owner,
                repo: repo.repo,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: repo.owner,
                repo: repo.repo,
                body: comment
              });
            }
